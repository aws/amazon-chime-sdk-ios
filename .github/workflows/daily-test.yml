name: Daily Test

on:
  schedule:
    # More information on cron https://crontab.guru/
    # Run after Android to avoid overlapping on the shared Sauce allocation.
    - cron: '0 16 * * *'

  workflow_dispatch:

# note: secrets can only be referenced in env or run
env:
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  DEMO_APP_DOWNLOAD_LINK: ${{ secrets.DEMO_APP_DOWNLOAD_LINK }}
  NO_VIDEO_CODECS_DEMO_APP_DOWNLOAD_LINK: ${{ secrets.NO_VIDEO_CODECS_DEMO_APP_DOWNLOAD_LINK }}
  HELPER_DEMO_URL: ${{ vars.HELPER_DEMO_URL }}
  ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME }}
  METRIC_NAME: ${{ secrets.METRIC_NAME }}
  METRIC_NAMESPACE: ${{ secrets.METRIC_NAMESPACE }}
  REGION: us-east-1
  HARNESS_DIR: integration/mobile-sdk-automation
  HUSKY_SKIP_INSTALL: '1'

permissions:
  id-token: write
  contents: read

jobs:
  daily-test:
    name: Amazon Chime iOS SDK Daily Test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # Avoid over-subscribing the shared Sauce allocation.
      max-parallel: 1
      matrix:
        # Latest 2 iOS versions. TODO: Upgrade to Appium 2 for OS 17 and above.
        os_list: ["15", "16"]
        demo_flavor_list: ["default", "no-video-codecs"]
    outputs:
      job-status: ${{ job.status }}

    steps:
      - name: Checkout test package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: always()
        with:
          persist-credentials: false

      - name: Get latest prod demo app
        if: always()
        working-directory: ${{ env.HARNESS_DIR }}
        run: |
          if [ "${{ matrix.demo_flavor_list }}" = "default" ]; then
            wget -O amazon-chime-sdk-app.ipa $DEMO_APP_DOWNLOAD_LINK;
          elif [ "${{ matrix.demo_flavor_list }}" = "no-video-codecs" ]; then
            wget -O amazon-chime-sdk-app.ipa $NO_VIDEO_CODECS_DEMO_APP_DOWNLOAD_LINK;
          else
            echo "Error: Unsupported demo app flavor: ${{ matrix.demo_flavor_list }}";
            exit 1;
          fi
      - name: Setup Node.js - 15.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: always()
        with:
          node-version: 15.14.0
          cache: npm
          cache-dependency-path: ${{ env.HARNESS_DIR }}/package-lock.json

      - name: Install Dependencies
        if: always()
        working-directory: ${{ env.HARNESS_DIR }}
        run: npm ci

      - name: Run test against specified iOS versions
        id: tests
        if: always()
        working-directory: ${{ env.HARNESS_DIR }}
        run: |
          : "${HELPER_DEMO_URL:?HELPER_DEMO_URL repository variable is not set}"
          upload_response=$(curl --fail-with-body --silent --show-error \
            -F 'payload=@amazon-chime-sdk-app.ipa' \
            -F 'name=amazon-chime-sdk-app.ipa' \
            -u "${{ secrets.SAUCE_USERNAME }}:${{ secrets.SAUCE_ACCESS_KEY }}" \
            'https://api.us-west-1.saucelabs.com/v1/storage/upload')
          id=$(jq -er '.item.id' <<< "$upload_response")
          npm run build
          npm run cma -- --app-url "sample.app" --demo-url "$HELPER_DEMO_URL" --log-level error --tag "@common" --app-id "${id}" --retry --platform-version "${{ matrix.os_list }}"

      - name: Send Notification
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        if: failure()
        with:
          payload: |
            {
              "Platform": "iOS",
              "Link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "Status": "${{ steps.tests.outcome }}"
            }

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: always()
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ env.REGION }}

      - name: Setup Node.js - 18.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: always()
        with:
          node-version: 18.x

      # The metric client is installed outside the harness so it cannot alter the harness lockfile.
      - name: Send Metric to CloudWatch
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-save --prefix metric-client @aws-sdk/client-cloudwatch
          NODE_PATH="$PWD/metric-client/node_modules" node -e "
          const { CloudWatchClient, PutMetricDataCommand } = require('@aws-sdk/client-cloudwatch');
          const client = new CloudWatchClient({ region: process.env.REGION });

          const value = '${{ steps.tests.outcome }}' === 'success' ? 1 : 0;

          const command = new PutMetricDataCommand({
            Namespace: process.env.METRIC_NAMESPACE,
            MetricData: [{
              MetricName: process.env.METRIC_NAME,
              Dimensions: [
                { Name: 'Platform', Value: 'iOS' },
                { Name: 'OS', Value: '${{ matrix.os_list }}' },
                { Name: 'Flavor', Value: '${{ matrix.demo_flavor_list }}' }
              ],
              Value: value,
            }]
          });

          client.send(command).then(() => console.log('Daily test result sent to CloudWatch: ' + value)).catch(err => {
            console.error('Failed to send metric. Error: ', err);
            process.exit(1);
          });
          ";
