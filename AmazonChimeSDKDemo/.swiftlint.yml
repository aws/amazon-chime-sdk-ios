excluded:
  - Pods

# The demo target ships no config of its own, so a modern SwiftLint applies its
# default severities, where these two rules are errors. SwiftLint runs in a
# script phase before Swift compilation, so the demo fails to build before it is
# ever type checked. Pin the thresholds so the build does not depend on which
# SwiftLint version happens to be installed.
type_body_length:
  warning: 350
  error: 1000
function_parameter_count:
  warning: 5
  error: 20
